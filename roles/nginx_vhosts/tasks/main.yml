---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create document root for each site
  ansible.builtin.file:
    path: "/var/www/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ sites }}"

- name: Render index page for each site
  ansible.builtin.template:
    src: index.html.j2
    dest: "/var/www/{{ item }}/index.html"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ sites }}"

- name: Render nginx virtual host for each site
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/conf.d/site-{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ sites }}"
  notify: Restart nginx

- name: Check nginx configuration
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false

- name: Ensure nginx is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
